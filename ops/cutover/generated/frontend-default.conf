map "$request_method:$uri" $edict_api_upstream {
    default http://backend:8000;
    "GET:/api/live-status" http://backend:8000;
    "GET:/api/queue-metrics" http://backend:8000;
    "GET:/api/agent-config" http://backend:8000;
    "GET:/api/model-change-log" http://backend:8000;
    "GET:/api/officials-stats" http://backend:8000;
    "GET:/api/morning-brief" http://backend:8000;
    "GET:/api/morning-config" http://backend:8000;
    "GET:/api/agents-status" http://backend:8000;
    "GET:/api/remote-skills-list" http://backend:8000;
    "GET:/api/court-discuss/list" http://backend:8000;
    "GET:/api/court-discuss/officials" http://backend:8000;
    "GET:/api/court-discuss/fate" http://backend:8000;
    ~^GET:/api/morning\-brief/ http://backend:8000;
    ~^GET:/api/task\-activity/ http://backend:8000;
    ~^GET:/api/scheduler\-state/ http://backend:8000;
    ~^GET:/api/skill\-content/ http://backend:8000;
    ~^GET:/api/court\-discuss/session/ http://backend:8000;
    "POST:/api/set-model" http://backend:8000;
    "POST:/api/set-dispatch-channel" http://backend:8000;
    "POST:/api/agent-wake" http://backend:8000;
    "POST:/api/task-action" http://backend:8000;
    "POST:/api/review-action" http://backend:8000;
    "POST:/api/advance-state" http://backend:8000;
    "POST:/api/archive-task" http://backend:8000;
    "POST:/api/scheduler-scan" http://backend:8000;
    "POST:/api/scheduler-retry" http://backend:8000;
    "POST:/api/scheduler-escalate" http://backend:8000;
    "POST:/api/scheduler-rollback" http://backend:8000;
    "POST:/api/morning-brief/refresh" http://backend:8000;
    "POST:/api/morning-config" http://backend:8000;
    "POST:/api/add-skill" http://backend:8000;
    "POST:/api/add-remote-skill" http://backend:8000;
    "POST:/api/update-remote-skill" http://backend:8000;
    "POST:/api/remove-remote-skill" http://backend:8000;
    "POST:/api/create-task" http://backend:8000;
    "POST:/api/court-discuss/start" http://backend:8000;
    "POST:/api/court-discuss/advance" http://backend:8000;
    "POST:/api/court-discuss/conclude" http://backend:8000;
    "POST:/api/court-discuss/destroy" http://backend:8000;
}

server {
    listen 3000;
    root /usr/share/nginx/html;
    index index.html;

    # Generated by render_stage_routing.py for stage 5: legacy_observation_window

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /api/ {
        proxy_pass $edict_api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /ws {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400;
    }
}
